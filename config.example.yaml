# review-watch example configuration. Location: ~/.config/review-watch/config.yaml
# (drop-ins in config.d/). Every key is shown with its default; delete what you do not change.
# Precedence: flags > repos.<id> > environment > global > defaults. Unknown keys are refused.
# Scalar keys can also be set as REVIEW_WATCH_<KEY> (nesting joined with __); lists,
# hooks, repos and the tool commands cannot.

# Hosts to poll. Required, no default; a missing or empty value exits 2. A list of host
# names only: the review account (login and account id) always comes from `forgectl whoami`.
hosts:
  - git.example.com

# Repo-id globs (path matching: * and ? within a path segment, a ** segment matches zero or
# more whole segments). exclude wins. Global only: a repo cannot set its own scope.
include: ["**"]
exclude: []

# Only the actor name; the review account is forgectl's (`forgectl whoami`).
me:
  name: me           # used in the default actor human:<name>; defaults to the OS username

# Who may start a review automatically. skip (default): a request is started only when the
# author belongs (GitHub: OWNER, MEMBER or COLLABORATOR; GitLab: the head is not a fork;
# either host: the login is in tiers.trusted_authors or <host>:<id> is in
# auto_approve.trusted_author_ids). Anyone else is kept as skipped (author_external) and a
# human `rerun` starts it. review removes the rule. Global only; not settable from the environment.
start:
  external_authors: skip

max_rounds: 3        # rounds per PR across request instances; per-repo override allowed
max_concurrent: 2    # rounds with a running session; with jobsctl the lower of this and jobsctl's free slots
max_attempts: 2      # launches per round before it fails

jobs:
  use_jobsctl: auto  # auto, true or false
  queue: reviews     # jobsctl queue; review-watch passes --kill-grace 125s and --max-retries 0
  pass_env: []       # env var names passed to the review job: through jobsctl's env file, or from poll's environment without jobsctl

review:
  skill: null        # review-run's default skill when null
  previous: true     # pass the PR's newest done review as --previous to review-run

# Risk tier thresholds. A per-repo override may only be lower or equal (stricter), never higher.
tiers:
  lines: [50, 300]   # changed lines: above the first is tier 1, above the second tier 2
  files: [3, 15]     # changed files: same
  sensitive_globs: []   # paths that make a round at least tier 2; per-repo values add
  trusted_authors: []   # logins (case-insensitive): tier rule where author_association is null (GitLab); on either host they also let the author start a round; global only
  allow_forks: true     # false makes a fork PR tier 3; a per-repo value may only be false

# Paths that make a round tier 3 and block any automatic action. A pattern without a
# slash matches the last path segment at any depth; a pattern with a slash is anchored at
# the repo root; a ** segment matches zero or more whole segments; ASCII case is folded.
# Patterns are validated at load (no empty, . or .. segment, no leading slash, at most 256
# characters). Per-repo values add to this list and never remove from it.
off_limits:
  - ".github/**"
  - ".gitlab-ci.yml"
  - ".gitlab/**"
  - ".circleci/**"
  - "Jenkinsfile"
  - "azure-pipelines.yml"
  - "Dockerfile*"
  - "docker-compose*"
  - "Makefile"
  - "GNUmakefile"
  - ".husky/**"
  - ".pre-commit-config.yaml"
  - ".gitmodules"
  - "**/.claude/**"
  - ".mcp.json"
  - "CLAUDE*.md"
  - "AGENTS.md"
  - "GEMINI.md"
  - ".cursor/**"
  - ".cursorrules"
  - ".vscode/**"
  - ".devcontainer/**"
  - ".envrc"
  - ".gitattributes"
  - "CODEOWNERS"
  - "**/auth/**"
  - "**/security/**"
  - "**/secrets/**"
  - "**/crypto/**"
  - "*.pem"
  - "*.key"
  - ".env"
  - ".env.*"

# Highest tier at which an automatic post or approve is even considered (0 to 3).
# Per-repo overrides may only be lower or equal.
max_post_tier: 1
max_approve_tier: 0

# Automatic actions are off by default. These global values are the default for every repo
# that does not set its own; enable them per repo (see repos below). auto_approve.enabled
# without auto_post.enabled for the same repo is a config error. Safety keys (max_*_tier,
# tiers, off_limits, auto_*, gate, limits) cannot be set from the environment.
auto_post:
  enabled: false
  policy: review-post      # gatectl policy
auto_approve:
  enabled: false
  policy: review-approve   # gatectl policy; pr-comment also needs allow_auto_approve for the repo
  trusted_author_ids: []   # global only: <host>:<account id> entries; an automatic approve needs the PR author's entry here
  # paths is per repo only (see repos below): an automatic approve needs every changed path
  # to match (anchored, case-sensitive, every entry contains a /); empty means no automatic
  # approve in that repo.

gate:
  timeout: 60s       # 1s to 600s; passed to gatectl check --timeout in whole seconds

limits:
  rounds_per_day: 50    # rounds counted per local day at their first launch; at the limit rounds stay queued; null is off
  timezone: null        # IANA zone name; null is the machine's local zone

poll:
  max_snapshots: 30        # snapshots per host and cycle
  recheck_interval: 1h     # how often unchanged items without a live round are re-read
  deadline: 20m            # whole-cycle deadline, 5m to 2h; the cycle starts nothing new after it
  failure_alert_after: 3   # consecutive failing cycles before post-attention fires for a host

retention:
  closed: 90d        # prune deletes closed items older than this; other items lose old revisions only
  log: 180d          # prune drops log.jsonl records and events of finished items older than this; the audit is never pruned

cron:
  schedule: "*/5 * * * *"   # five fields of [0-9*/,-] or month and day names
  env_file: null     # sourced before poll in the cron line, for example ~/.config/review-watch/env

# Sibling tool commands: an argv list run without a shell. Use absolute paths under cron.
forgectl_cmd: [forgectl]
review_run_cmd: [review-run]
pr_comment_cmd: [pr-comment]
gatectl_cmd: [gatectl]
jobsctl_cmd: [jobsctl]

# Hooks: pre-round (may veto with a non-zero exit, escalate with 13), post-draft,
# post-attention, post-post. Each entry: cmd (run with sh -c), timeout (a duration such as
# 45s, or a bare integer in seconds; default 30), async (post hooks only; refused on
# pre-round). Payloads are JSON on stdin and never hold text from a host or a model.
hooks:
  pre-round: []
  post-draft: []
  post-attention: []
  post-post: []
  # post-attention:
  #   - cmd: "notify-send review-watch"
  #     timeout: 30
  #     async: true

# Per-repo overrides, keyed by the canonical repo id (host/<full project path>, exactly as
# forgectl returns it). Allowed keys: max_rounds, max_attempts, max_concurrent, tiers (lines,
# files, sensitive_globs, allow_forks), max_post_tier, max_approve_tier, off_limits,
# auto_post, auto_approve (enabled, policy, paths), review.skill.
repos:
  git.example.com/team/service:
    max_rounds: 2
    tiers:
      lines: [40, 200]
      sensitive_globs: ["migrations/**"]
    max_post_tier: 1
    off_limits: ["deploy/**"]
    auto_post:
      enabled: false
      policy: review-post
    auto_approve:
      enabled: false
      paths: []        # globs, each containing a /; an automatic approve needs every changed path to match
    review:
      skill: null
